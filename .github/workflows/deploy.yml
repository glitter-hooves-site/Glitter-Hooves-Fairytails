name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  # Past events are filtered out at BUILD time, so the live page freezes on
  # whatever "today" was at the last deploy. Without this, an event stays
  # listed until someone happens to merge something. Rebuild nightly at
  # 3am ET (2am EST) — comfortably after any event's day has ended at the farm.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
